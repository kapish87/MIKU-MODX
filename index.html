<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MIKU MODX - Premium Game Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 🎨 PREMIUM THEME */
  :root {
    --bg-color: #f8fafc;
    --primary: #e11d48;
    --primary-hover: #be123c;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --card-bg: #ffffff;
    --border-color: #e2e8f0;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05);
    --shadow-lg: 0 20px 40px -10px rgba(225, 29, 72, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }

  /* HEADER */
  header { text-align: center; padding: 30px 0 20px; display: flex; flex-direction: column; align-items: center; }
  .app-icon {
    width: 100px; height: 100px; border-radius: 24px; object-fit: cover;
    box-shadow: 0 12px 24px rgba(225, 29, 72, 0.25); margin-bottom: 20px;
    border: 4px solid #fff; background: #fff;
  }
  header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 8px; }
  header p { font-size: 1rem; color: var(--text-muted); font-weight: 500; margin-bottom: 20px; }

  /* 🔥 PLAY STORE STYLE STATS BAR */
  .stats-bar {
    display: flex; justify-content: center; align-items: center; 
    background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color);
    padding: 12px 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm); width: 100%; max-width: 400px;
  }
  .stat-item { flex: 1; text-align: center; position: relative; }
  .stat-item:not(:last-child)::after {
    content: ''; position: absolute; right: 0; top: 15%; bottom: 15%; width: 1px; background: var(--border-color);
  }
  .stat-value { font-weight: 800; font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .stat-value svg { width: 14px; height: 14px; fill: var(--primary); }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  /* DOWNLOAD BUTTON */
  .btn-download {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--primary); color: #fff; text-decoration: none;
    padding: 16px 32px; border-radius: 100px; font-weight: 700; font-size: 1.1rem;
    box-shadow: var(--shadow-lg); transition: 0.3s; width: 100%; max-width: 320px; justify-content: center;
  }
  .btn-download:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 25px 50px -12px rgba(225, 29, 72, 0.3); }
  .btn-download svg { width: 22px; height: 22px; fill: currentColor; }

  /* 🔥 HERO SLIDER */
  .hero-slider-container {
    position: relative; width: 100%; aspect-ratio: 16/9; max-height: 500px;
    border-radius: 20px; overflow: hidden; background: var(--card-bg);
    box-shadow: var(--shadow-md); border: 1px solid var(--border-color); margin-bottom: 30px;
  }
  .slider-track { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
  .slide { min-width: 100%; height: 100%; position: relative; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  .slider-dots {
    position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 10; background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 100px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(15, 23, 42, 0.3); cursor: pointer; transition: 0.3s; }
  .dot.active { background: var(--primary); width: 24px; border-radius: 10px; }

  /* SECTIONS */
  .section-card {
    background: var(--card-bg); border-radius: 20px; padding: 24px 20px;
    margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);
  }
  .section-title {
    font-size: 1.3rem; font-weight: 700; color: var(--text-main);
    margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
  }
  .icon-box {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 10px; background: #ffe4e6; color: var(--primary);
  }
  .icon-box svg { width: 20px; height: 20px; }

  /* 🛠️ FEATURES GRID */
  #featList { list-style: none; display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 600px) { #featList { grid-template-columns: repeat(2, 1fr); } }
  
  #featList li {
    background: var(--bg-color); padding: 16px; border-radius: 16px;
    border: 1px solid var(--border-color); display: flex; gap: 14px; 
    transition: 0.3s; align-items: flex-start;
  }
  #featList li:hover { border-color: #fda4af; background: #fff; box-shadow: var(--shadow-sm); transform: translateY(-2px); }
  .feat-icon { color: var(--primary); flex-shrink: 0; margin-top: 2px; }
  .feat-icon svg { width: 20px; height: 20px; }
  .feat-text { flex: 1; min-width: 0; }
  .feat-text b { display: block; font-size: 1rem; color: var(--text-main); margin-bottom: 4px; word-wrap: break-word; }
  .feat-text span { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; display: block; word-wrap: break-word; }

  /* 🌟 REVIEWS SECTION */
  .review-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  .big-rating { font-size: 3.5rem; font-weight: 800; line-height: 1; color: var(--text-main); }
  .stars-wrapper { display: flex; flex-direction: column; gap: 4px; }
  .stars { display: flex; gap: 2px; color: #fbbf24; }
  .stars svg { width: 18px; height: 18px; fill: currentColor; }
  .review-count { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
  
  /* Review Form */
  .review-form-box {
    background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 20px;
  }
  .review-form-box h4 { font-size: 0.95rem; margin-bottom: 10px; color: var(--text-main); }
  .star-input { display: flex; gap: 4px; margin-bottom: 12px; cursor: pointer; }
  .star-input svg { width: 24px; height: 24px; fill: #e2e8f0; transition: 0.2s; }
  .star-input svg.active { fill: #fbbf24; }
  .review-textarea {
    width: 100%; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px;
    font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 80px; margin-bottom: 10px; outline: none;
  }
  .review-textarea:focus { border-color: var(--primary); }
  .btn-submit-review {
    background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 10px 20px;
    font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; width: 100%;
  }
  .btn-submit-review:hover { background: var(--primary-hover); }

  /* List of User Reviews */
  .review-item { border-top: 1px solid var(--border-color); padding: 16px 0; }
  .review-item:last-child { border-bottom: none; padding-bottom: 0; }
  .review-user { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text-muted); font-size: 0.9rem; }
  .user-name { font-weight: 600; font-size: 0.95rem; }
  .review-stars { display: flex; gap: 2px; color: #fbbf24; margin-bottom: 4px; }
  .review-stars svg { width: 12px; height: 12px; fill: currentColor; }
  .review-text { font-size: 0.9rem; color: var(--text-muted); }

  /* TIMELINE UPDATES */
  #log { list-style: none; display: flex; flex-direction: column; gap: 20px; position: relative; }
  #log::before { content: ''; position: absolute; left: 9px; top: 10px; bottom: 10px; width: 2px; background: var(--border-color); }
  #log > li { padding-left: 28px; position: relative; }
  #log > li::after {
    content: ''; position: absolute; left: 2px; top: 6px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--primary); border: 3px solid var(--card-bg); box-shadow: 0 0 0 1px var(--border-color);
  }
  #log h3 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; font-size: 1rem; margin-bottom: 8px; }
  #log time { font-size: 0.75rem; color: var(--text-muted); background: var(--bg-color); padding: 4px 10px; border-radius: 100px; font-weight: 600; border: 1px solid var(--border-color); margin-top: 4px; }
  #log ul { padding-left: 16px; color: var(--text-muted); font-size: 0.9rem; }
  #log ul li { margin-bottom: 4px; }

  /* FAQ */
  #faqList details {
    background: var(--bg-color); border-radius: 14px; margin-bottom: 10px;
    border: 1px solid var(--border-color); transition: 0.3s; overflow: hidden;
  }
  #faqList details[open] { border-color: #fda4af; background: #fff; box-shadow: var(--shadow-sm); }
  #faqList summary {
    padding: 16px; font-weight: 600; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none; gap: 10px;
  }
  #faqList summary::-webkit-details-marker { display: none; }
  .faq-icon { color: var(--text-muted); transition: 0.3s; flex-shrink: 0; }
  #faqList details[open] .faq-icon { transform: rotate(180deg); color: var(--primary); }
  #faqList p { padding: 0 16px 16px; color: var(--text-muted); font-size: 0.9rem; }

  /* FOOTER */
  footer { text-align: center; margin-top: 30px; padding-top: 10px; }
  #links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #links a {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-main); background: var(--card-bg); text-decoration: none; 
    padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; 
    transition: 0.3s; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); flex: 1; min-width: 140px;
  }
  #links a:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }

  /* ANIMATIONS */
  .reveal { opacity: 0; transform: translateY(30px); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
  .reveal.active { opacity: 1; transform: translateY(0); }
</style>
</head>

<script>
/* ============================================================
   👇 EDIT YOUR DATA HERE
   ============================================================ */
const CONFIG = {
  sliderImages: [
    "https://i.ibb.co/ksgRj63t/load.png",
    "https://i.ibb.co/rRtg3Pzb/bec3d7f60a8787ecca6055bff6ebcbde.jpg",
    "https://i.ibb.co/p6ksk81x/1.jpg",
    "https://i.ibb.co/JwBS0R1R/5.jpg",
    "https://i.ibb.co/LzkmjGmg/2.jpg"
  ],

  features: [
    { t: "100% Undetectable", d: "Advanced anti-ban system ensures your account remains completely safe." },
    { t: "Auto Update", d: "The app updates itself automatically whenever a new game patch is released." },
    { t: "Premium Unlocked", d: "Access and use all paid premium features completely for free." },
    { t: "Zero Lag", d: "Experience super smooth performance with absolutely zero lag." },
    { t: "24/7 Support", d: "Our team is always available to help you with any issues." },
    { t: "Lightweight", d: "The app is only 15MB, saving your phone's valuable memory." }
  ],

  updates: [
    {
      v: "Version 9.0",
      date: "Today",
      notes: ["New UI design added", "Bug fixes and speed improvements", "Added Android 14 support"]
    },
    {
      v: "Version 8.5",
      date: "Last week",
      notes: ["Added new mods", "Updated security patch"]
    }
  ],

  faq: [
    { q: "Is this app free to use?", a: "Yes, the basic features are completely free. Join our Telegram for premium access." },
    { q: "How do I install it?", a: "Click the download button and install the APK file on your device." },
    { q: "Can my account get banned?", a: "No, our advanced anti-ban system is 100% secure and undetectable." }
  ],

  telegramChannel: "https://t.me/YourChannel",
  telegramGroup: "https://t.me/YourGroup",
  contactUrl: "mailto:your@email.com"
};
/* ============================================================
   👆 DO NOT EDIT BELOW THIS LINE
   ============================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const isSet = v => v && v.trim() !== "" && v !== "#";

/* --- 1. HERO SLIDER LOGIC --- */
const track = $("sliderTrack");
const dotsContainer = $("sliderDots");
let currentSlide = 0;

if (CONFIG.sliderImages && CONFIG.sliderImages.length > 0) {
  CONFIG.sliderImages.forEach((src, index) => {
    const slide = document.createElement("div");
    slide.className = "slide";
    slide.innerHTML = `<img src="${src}" alt="Slide ${index+1}" onerror="this.src='https://placehold.co/800x450/f1f5f9/64748b?text=Image+Not+Found'">`;
    track.appendChild(slide);

    const dot = document.createElement("div");
    dot.className = `dot ${index === 0 ? 'active' : ''}`;
    dot.onclick = () => goToSlide(index);
    dotsContainer.appendChild(dot);
  });

  function goToSlide(index) {
    currentSlide = index;
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === currentSlide);
    });
  }

  let slideInterval = setInterval(() => {
    let next = (currentSlide + 1) % CONFIG.sliderImages.length;
    goToSlide(next);
  }, 3500);

  let startX = 0;
  track.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
  track.addEventListener('touchend', e => {
    let endX = e.changedTouches[0].clientX;
    if (startX - endX > 50) goToSlide((currentSlide + 1) % CONFIG.sliderImages.length);
    else if (endX - startX > 50) goToSlide((currentSlide - 1 + CONFIG.sliderImages.length) % CONFIG.sliderImages.length);
    clearInterval(slideInterval); 
  });
}

/* --- 2. FEATURES --- */
const featIconSVG = `<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;

$("featList").innerHTML = CONFIG.features.map(f =>
  `<li>
    <div class="feat-icon">${featIconSVG}</div>
    <div class="feat-text"><b>${esc(f.t)}</b><span>${esc(f.d)}</span></div>
  </li>`).join("");

/* --- 3. UPDATES --- */
$("log").innerHTML = CONFIG.updates.map(u =>
  `<li>
     <h3>${esc(u.v)} <time>${esc(u.date)}</time></h3>
     <ul>${u.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
   </li>`).join("");

/* --- 4. FAQ --- */
const chevronIcon = `<svg class="faq-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>`;

$("faqList").innerHTML = CONFIG.faq.map(f =>
  `<details><summary>${esc(f.q)} ${chevronIcon}</summary><p>${esc(f.a)}</p></details>`).join("");

/* --- 5. FOOTER LINKS --- */
const links = [
  ["Telegram Channel", CONFIG.telegramChannel],
  ["Telegram Group", CONFIG.telegramGroup],
  ["Contact Me", CONFIG.contactUrl]
].filter(l => isSet(l[1]));

$("links").innerHTML = links.map(l =>
  `<a href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a>`).join("");

/* --- 6. SCROLL ANIMATIONS --- */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('active');
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

/* --- 7. REVIEW SYSTEM LOGIC --- */
const starInput = document.getElementById('starInput');
const stars = starInput.querySelectorAll('svg');
let currentRating = 5; // Default
let userReviews = JSON.parse(localStorage.getItem('miku_reviews')) || [];

// Set initial stars visual
function setStars(rating) {
  stars.forEach(s => {
    let val = parseInt(s.getAttribute('data-val'));
    if (val <= rating) s.classList.add('active');
    else s.classList.remove('active');
  });
}
setStars(currentRating);

// Hover & Click logic for stars
stars.forEach(star => {
  star.addEventListener('mouseover', () => setStars(parseInt(star.getAttribute('data-val'))));
  star.addEventListener('mouseout', () => setStars(currentRating));
  star.addEventListener('click', () => {
    currentRating = parseInt(star.getAttribute('data-val'));
    setStars(currentRating);
  });
});

// Render Reviews
function renderReviews() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  
  // Calculate new average
  let baseAvg = 4.6;
  let baseCount = 125;
  let totalStars = baseAvg * baseCount;
  
  userReviews.forEach(r => {
    totalStars += r.rating;
    baseCount++;
  });
  
  let newAvg = (totalStars / baseCount).toFixed(1);
  
  document.getElementById('headerRating').textContent = newAvg;
  document.getElementById('bigRatingVal').textContent = newAvg;
  document.getElementById('reviewCountText').textContent = `Based on ${baseCount} reviews`;

  // Show only last 5 reviews
  const displayReviews = userReviews.slice(-5).reverse();
  
  if(displayReviews.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding:20px 0;">No reviews yet. Be the first to review!</p>';
    return;
  }

  displayReviews.forEach(review => {
    let starHTML = '';
    for(let i=1; i<=5; i++) {
      starHTML += `<svg viewBox="0 0 24 24" style="fill: ${i <= review.rating ? '#fbbf24' : '#e2e8f0'}"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
    }
    list.innerHTML += `
      <div class="review-item">
        <div class="review-user">
          <div class="user-avatar">U</div>
          <div class="user-name">User</div>
        </div>
        <div class="review-stars">${starHTML}</div>
        <div class="review-text">${esc(review.text)}</div>
      </div>
    `;
  });
}

document.getElementById('submitReviewBtn').addEventListener('click', () => {
  const text = document.getElementById('reviewText').value.trim();
  if(!text) return alert('Please write a review first!');
  
  userReviews.push({ rating: currentRating, text: text });
  localStorage.setItem('miku_reviews', JSON.stringify(userReviews));
  
  document.getElementById('reviewText').value = '';
  renderReviews();
});

// Initial Render
renderReviews();
</script>
