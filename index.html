<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIKU MODX – Game Tools for Android</title>
<meta name="description" content="Download MIKU MODX, see screenshots, update notes and get help on Telegram.">
<meta name="theme-color" content="#e11d48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<style>
:root{
  --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#5b6b82; --line:#e2e8f0;
  --primary:#e11d48; --primary-hover:#be123c; --tint:#ffe4e6; --tint-line:#fda4af;
  --glow:rgba(225,29,72,.14); --shadow:0 2px 8px rgba(0,0,0,.04); --shadow-lg:0 18px 40px -10px rgba(225,29,72,.35);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0e1015; --card:#171a21; --text:#f1f5f9; --muted:#9aa6b8; --line:#2a2f3a; --tint:#3a1621; --tint-line:#7f1d3a; --glow:rgba(225,29,72,.2); --shadow:0 2px 8px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 110px}

/* hero */
.hero{text-align:center;padding:36px 0 26px;display:flex;flex-direction:column;align-items:center;position:relative}
.hero::before{content:"";position:absolute;top:-40px;left:50%;width:520px;max-width:120vw;height:320px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.app-icon{position:relative;width:104px;height:104px;border-radius:26px;object-fit:cover;border:4px solid var(--card);box-shadow:0 14px 28px var(--glow);margin-bottom:18px;background:var(--card)}
h1{position:relative;font-size:clamp(2rem,8vw,2.8rem);font-weight:800;letter-spacing:-.04em;line-height:1.1}
.sub{position:relative;color:var(--muted);font-weight:500;margin:8px 0 22px;max-width:36ch}
.stats{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;margin-bottom:22px;box-shadow:var(--shadow);width:100%;max-width:420px}
.stat{flex:1;text-align:center;padding:0 8px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:1.1rem;font-weight:800}
.stat span{font-size:.75rem;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--primary);color:#fff;text-decoration:none;font-weight:700;font-size:1.1rem;padding:16px 32px;border-radius:100px;box-shadow:var(--shadow-lg);transition:transform .2s,background .2s;width:100%;max-width:320px}
.btn:hover{background:var(--primary-hover);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px;fill:currentColor}
.note{position:relative;margin-top:12px;font-size:.82rem;color:var(--muted)}

/* slider: 16:9, one image at a time, auto-slides, swipe works */
.slider{position:relative;margin:6px 0 26px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);aspect-ratio:16/9;background:var(--card)}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;overflow:hidden;cursor:zoom-in;background:#0f172a}
.slide .fg{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(15,23,42,.55);color:#fff;font-size:22px;cursor:pointer;display:none}
.arrow.prev{left:10px}.arrow.next{right:10px}
@media(hover:hover){.arrow{display:block}}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.9);padding:6px 10px;border-radius:100px}
.dot{width:8px;height:8px;border-radius:99px;border:0;background:rgba(15,23,42,.3);cursor:pointer;transition:width .3s,background .3s;padding:0}
.dot.on{width:22px;background:var(--primary)}
#viewer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
#viewer[hidden]{display:none}
#viewer img{max-width:100%;max-height:100%;border-radius:16px;object-fit:contain}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:1.25rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.ico{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--primary)}
.ico svg{width:20px;height:20px}

#feat{list-style:none;display:grid;gap:12px}
@media(min-width:600px){#feat{grid-template-columns:1fr 1fr}}
#feat li{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);transition:border-color .2s}
#feat li:hover{border-color:var(--tint-line)}
#feat svg{width:20px;height:20px;color:var(--primary);flex:none;margin-top:3px}
#feat b{display:block;margin-bottom:2px}
#feat span{color:var(--muted);font-size:.9rem;line-height:1.5}

/* reviews (only shown when you add real ones) */
.rev{border-top:1px solid var(--line);padding:14px 0}
.rev:first-of-type{border-top:0}
.rev .who{font-weight:700;font-size:.95rem}
.rev .st{color:#f59e0b;letter-spacing:2px;font-size:.9rem}
.rev p{color:var(--muted);font-size:.92rem}

#log{list-style:none;position:relative;display:flex;flex-direction:column;gap:20px}
#log::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--line)}
#log>li{position:relative;padding-left:30px}
#log>li::after{content:"";position:absolute;left:2px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--primary);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
#log h3{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;font-size:1rem;margin-bottom:6px}
#log time{font-size:.75rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:100px;font-weight:600}
#log ul{padding-left:18px;color:var(--muted);font-size:.92rem}

details{background:var(--bg);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details[open]{border-color:var(--tint-line)}
summary{padding:16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary svg{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .25s}
details[open] summary svg{transform:rotate(180deg);color:var(--primary)}
details p{padding:0 16px 16px;color:var(--muted);font-size:.93rem}

footer{text-align:center;margin-top:26px}
#links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#links a{flex:1;min-width:140px;padding:12px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:.9rem;transition:border-color .2s,color .2s}
#links a:hover{border-color:var(--primary);color:var(--primary)}
.legal{margin-top:20px;font-size:.78rem;color:var(--muted);max-width:60ch;margin-inline:auto}

/* sticky mobile download bar */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;transform:translateY(110%);transition:transform .3s}
.sticky.on{transform:none}
.sticky .btn{padding:13px 24px;font-size:1rem;box-shadow:none}
@media(min-width:760px){.sticky{display:none}}

/* entrance: one fade on each card, skipped for reduced motion or no JS */
.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
.js .reveal.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .reveal{opacity:1;transform:none;transition:none}
  .track{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero reveal">
    <img id="icon" class="app-icon" alt="App icon" width="104" height="104">
    <h1 id="name">MIKU MODX</h1>
    <p class="sub" id="tag"></p>
    <div class="stats" id="stats"></div>
    <a id="dl" class="btn" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
      <span>Download APK</span>
    </a>
    <p class="note" id="note"></p>
  </header>

  <div class="slider reveal" id="sliderBox" aria-roledescription="carousel" aria-label="Screenshots">
    <div class="track" id="track" tabindex="0"></div>
    <button class="arrow prev" id="prev" aria-label="Previous image">&#8249;</button>
    <button class="arrow next" id="next" aria-label="Next image">&#8250;</button>
    <div class="dots" id="dots"></div>
  </div>

  <section class="card reveal">
    <h2><span class="ico"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.3 6.9L21 12l-5.7 2.1L13 21l-2.3-6.9L5 12l5.7-2.1L13 3z"/></svg></span>Features</h2>
    <ul id="feat"></ul>
  </section>

  <section class="card reveal" id="revCard" hidden>
    <h2><span class="ico"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5m-9 6l2-3h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v14z"/></svg></span>What users say</h2>
    <div id="revList"></div>
  </section>

  <section class="card reveal">
    <h2><span class="ico"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></span>What’s new</h2>
    <ul id="log"></ul>
  </section>

  <section class="card reveal">
    <h2><span class="ico"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.2 9c.5-1.2 2-2 3.8-2 2.2 0 4 1.3 4 3 0 1.4-1.3 2.6-3 2.9-.5.1-1 .5-1 1.1m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></span>FAQ</h2>
    <div id="faq"></div>
  </section>

  <footer class="reveal">
    <div id="links"></div>
    <p class="legal" id="legal"></p>
  </footer>
</div>

<div id="viewer" role="dialog" aria-label="Screenshot preview" hidden><img alt=""></div>

<div class="sticky" id="sticky"><a id="dl2" class="btn" href="#"><span>Download APK</span></a></div>

<script>
/* =========================================================
   EDIT ONLY THIS BLOCK
   Leave a value empty ("") to hide it from the page.
   ========================================================= */
const CONFIG = {
  name: "MIKU MODX",
  tagline: "Game tools for Android, free to start.",
  version: "1.8",
  rating: "",              // fill in ONLY if you have a real rating, e.g. "4.6"
  downloads: "475+",       // use your real download count
  size: "10 MB",

  iconUrl: "https://i.ibb.co/XxYbDBMK/3b0cc54bd86d572a45abe6571803af26.jpg",
  downloadUrl: "https://raw.githubusercontent.com/kapish87/Moj/refs/heads/main/%F0%9D%97%A0%F0%9D%97%9C%F0%9D%97%9E%F0%9D%97%A8%20%F0%9D%97%A0%F0%9D%97%A2%F0%9D%97%97%F0%9D%97%AB_1.8.apk",   // <-- put your real APK link here

  sliderImages: [
    "https://i.ibb.co/ZRhtknmv/file-00000000f33882088f0ce89f20eeee6b.png",
    "https://i.ibb.co/5bvNCq0/file-00000000e51082088741b4c4c3118d8c.png",
    "https://i.ibb.co/r24Tchz6/file-00000000311482088dd447f4408cd38e.png",
    "https://i.ibb.co/ns17cHPK/file-000000005c8c8208b374a542dd2758ab.png",
    "https://i.ibb.co/qYLpSDRR/file-00000000e5c48208b832e44e57760563.png"
  ],

  features: [
    { t: "Free to start",     d: "Basic features are free. Premium access is available through Telegram." },
    { t: "Small download",    d: "Only about 10 MB, so it installs fast and saves storage." },
    { t: "Simple to use",     d: "Clean menus so you can find what you need in a tap." },
    { t: "Regular updates",   d: "New builds and fixes are posted on this page first." },
    { t: "Help on Telegram",  d: "Ask questions in the group and get help from the team." },
    { t: "Android 14 ready",  d: "Tested to install and open on current Android versions." }
  ],

  /* Add ONLY real user reviews here. The section stays hidden while this list is empty. */
  reviews: [
    // { name: "Aung", rating: 5, text: "Works fine on my phone." }
  ],

  updates: [
    { v: "Version 1.8", date: "Latest", notes: ["New UI design added", "Bug fixes and speed improvements", "Added Android 14 support"] }
    // Add older versions above/below like: { v: "Version 1.7", date: "10 Nov 2026", notes: ["What changed"] },
  ],


  faq: [
    { q: "Is this app free to use?", a: "Yes, the basic features are free. Join our Telegram for premium access." },
    { q: "How do I install it?", a: "Tap Download, open the APK file, and allow “Install unknown apps” if Android asks." },
    { q: "Can my game account get banned?", a: "Any third-party tool can carry a risk, and we cannot promise it is safe. Use it at your own risk and avoid your main account." },
    { q: "The download does not start.", a: "Check your internet and try again. If it still fails, message us on Telegram." }
  ],

  telegramChannel: "https://t.me/MIKU_MODX",
  telegramGroup:   "https://t.me/+HOhUBIF9dSs1NTRl",
  contactUrl:      "https://t.me/Murii_murii",

  legal: "Not affiliated with or endorsed by any game publisher. All game names and trademarks belong to their owners. Use at your own risk."
};
/* ===================== end of config ===================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isSet = v => v && v.trim() !== "" && v !== "#";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* header */
document.title = CONFIG.name + " – Game Tools for Android";
$("name").textContent = CONFIG.name;
$("tag").textContent = CONFIG.tagline;
$("note").textContent = "Version " + CONFIG.version + " · Android";
const icon = $("icon");
icon.src = CONFIG.iconUrl;
icon.onerror = () => { icon.onerror = null; icon.src = "https://cdn-icons-png.flaticon.com/512/2592/2592899.png"; };

const statItems = [[CONFIG.rating ? CONFIG.rating + " ★" : "", "Rating"], [CONFIG.downloads, "Downloads"], [CONFIG.size, "Size"]].filter(s => s[0]);
if (statItems.length) $("stats").innerHTML = statItems.map(s => `<div class="stat"><b>${esc(s[0])}</b><span>${s[1]}</span></div>`).join("");
else $("stats").hidden = true;

/* download buttons (both the main one and the sticky one) */
[$("dl"), $("dl2")].forEach(a => {
  a.href = CONFIG.downloadUrl;
  a.addEventListener("click", e => {
    if (!isSet(CONFIG.downloadUrl) || CONFIG.downloadUrl.includes("example.com")) {
      e.preventDefault();
      alert("Download link is not set yet.");
    }
  });
});

/* slider */
const track = $("track"), dots = $("dots"), imgs = CONFIG.sliderImages || [], viewer = $("viewer");
if (imgs.length) {
  const fail = e => { e.target.onerror = null; e.target.src = "https://placehold.co/800x450?text=Image+not+found"; };
  imgs.forEach((src, i) => {
    const s = document.createElement("div");
    s.className = "slide"; s.tabIndex = 0; s.setAttribute("role", "button");
    s.setAttribute("aria-label", "Open image " + (i + 1) + " of " + imgs.length);
    const fg = new Image(); fg.className = "fg"; fg.alt = "Screenshot " + (i + 1); fg.src = src; fg.loading = i === 0 ? "eager" : "lazy"; fg.decoding = "async"; fg.onerror = fail;
    s.append(fg); track.appendChild(s);
    const open = () => { viewer.querySelector("img").src = fg.src; viewer.hidden = false; };
    s.onclick = open;
    s.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
    const d = document.createElement("button");
    d.className = "dot"; d.setAttribute("aria-label", "Go to image " + (i + 1));
    d.onclick = () => { pauseUntil = Date.now() + 8000; go(i); };
    dots.appendChild(d);
  });
  let cur = 0, pauseUntil = 0, hover = false;
  const mark = () => [...dots.children].forEach((d, i) => d.classList.toggle("on", i === cur));
  const go = i => {
    cur = (i + imgs.length) % imgs.length;
    track.scrollTo({ left: cur * track.clientWidth, behavior: reduce ? "auto" : "smooth" });
    mark();
  };
  let raf;
  track.addEventListener("scroll", () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { cur = Math.round(track.scrollLeft / track.clientWidth); mark(); });
  }, { passive: true });
  $("prev").onclick = () => { pauseUntil = Date.now() + 8000; go(cur - 1); };
  $("next").onclick = () => { pauseUntil = Date.now() + 8000; go(cur + 1); };
  ["pointerdown", "wheel", "touchstart"].forEach(ev => track.addEventListener(ev, () => pauseUntil = Date.now() + 8000, { passive: true }));
  track.addEventListener("mouseenter", () => hover = true);
  track.addEventListener("mouseleave", () => hover = false);
  viewer.onclick = () => { viewer.hidden = true; };
  document.addEventListener("keydown", e => { if (e.key === "Escape") viewer.hidden = true; });
  mark();
  if (!reduce && imgs.length > 1) setInterval(() => { if (!hover && !document.hidden && viewer.hidden && Date.now() > pauseUntil) go(cur + 1); }, 3800);
} else $("sliderBox").hidden = true;

/* features */
const tick = `<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
$("feat").innerHTML = CONFIG.features.map(f => `<li>${tick}<div><b>${esc(f.t)}</b><span>${esc(f.d)}</span></div></li>`).join("");

/* real reviews only */
if (CONFIG.reviews && CONFIG.reviews.length) {
  $("revCard").hidden = false;
  $("revList").innerHTML = CONFIG.reviews.map(r => {
    const n = Math.max(1, Math.min(5, +r.rating || 5));
    return `<div class="rev"><div class="who">${esc(r.name)}</div><div class="st" aria-label="${n} out of 5 stars">${"★".repeat(n)}${"☆".repeat(5 - n)}</div><p>${esc(r.text)}</p></div>`;
  }).join("");
}

/* updates + faq */
$("log").innerHTML = CONFIG.updates.map(u => `<li><h3>${esc(u.v)} <time>${esc(u.date)}</time></h3><ul>${u.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></li>`).join("");
const chev = `<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>`;
$("faq").innerHTML = CONFIG.faq.map(f => `<details><summary>${esc(f.q)}${chev}</summary><p>${esc(f.a)}</p></details>`).join("");

/* footer */
$("links").innerHTML = [["Telegram channel", CONFIG.telegramChannel], ["Telegram group", CONFIG.telegramGroup], ["Contact", CONFIG.contactUrl]]
  .filter(l => isSet(l[1])).map(l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a>`).join("");
$("legal").textContent = CONFIG.legal || "";

/* entrance + sticky bar (both fail safe: content is visible without JS or IntersectionObserver) */
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("on"); io.unobserve(e.target); } }), { threshold: .08 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  new IntersectionObserver(([e]) => $("sticky").classList.toggle("on", !e.isIntersecting && e.boundingClientRect.top < 0)).observe($("dl"));
} else document.querySelectorAll(".reveal").forEach(el => el.classList.add("on"));
</script>
</body>
</html>
